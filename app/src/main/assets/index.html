<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>dronmxE · MTP RC 2 Bridge</title>
  <script src="jszip.min.js"></script>
  <style>
    :root {
      --bg-root:#121316; --bg-panel:#181a20; --bg-hdr:#1e2027; --bg-colhd:#16181e;
      --bg-hovr:#22252e; --bg-sel:#1a2f4c; --border:#2b2e38; --divider:rgba(255,255,255,0.07);
      --txt:#eef0f6; --muted:#949ba9; --dim:#5c6275; --accent:#38bdf8;
      --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
      --pp-bg:#3b1c6b; --pp-txt:#c4b5fd;
      --tp-bg:#0d3a3a; --tp-txt:#5eead4;
      --bp-bg:#172554; --bp-txt:#93c5fd;
      --op-bg:#7c2d12; --op-txt:#fdba74;
    }
    *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
    body{background:var(--bg-root);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
    
    /* STATUS BAR */
    .sbar{background:#0e1014;border-bottom:1px solid var(--border);height:36px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .sleft{display:flex;align-items:center;gap:8px}
    .sdot{width:8px;height:8px;border-radius:50%;background:var(--amber);transition:background .3s,box-shadow .3s}
    .sdot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
    .sdot.err{background:var(--red)}
    .slabel{font-size:11px;font-weight:600;color:var(--muted)}
    .btn-rc{font-size:11px;font-weight:700;background:#22252e;color:var(--txt);border:1px solid var(--border);border-radius:5px;padding:4px 10px;cursor:pointer}
    .btn-rc:active{background:#2d313d}

    /* TAB BAR (portrait) */
    .tbar{display:none;background:#0e1014;border-bottom:1px solid var(--border)}
    .titem{flex:1;padding:10px 6px;text-align:center;background:transparent;color:var(--dim);border:none;font-size:11px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
    .titem.active{color:var(--accent);border-bottom-color:var(--accent)}

    /* SPLIT PANEL */
    .split{flex:1;display:flex;overflow:hidden}
    .panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;border-right:1px solid var(--border);background:var(--bg-panel)}
    .panel:last-child{border-right:none}

    /* PANEL HEADER */
    .phdr{height:42px;background:var(--bg-hdr);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0}
    .ptitle{font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px}
    .hacts{display:flex;gap:5px}
    .ibtn{height:28px;padding:0 8px;border-radius:5px;background:#252932;border:1px solid var(--border);color:var(--txt);font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer}
    .ibtn:active{background:#303542}

    /* COL HEAD */
    .colhd{display:flex;align-items:center;justify-content:space-between;padding:5px 12px;background:var(--bg-colhd);border-bottom:1px solid var(--border);font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;flex-shrink:0}
    .colhd span:last-child{margin-left:auto;text-align:right}

    /* ROWS LIST */
    .rlist{flex:1;overflow-y:auto;overflow-x:hidden}
    .rlist::-webkit-scrollbar{width:4px}
    .rlist::-webkit-scrollbar-thumb{background:#303540;border-radius:2px}

    /* ROW ITEM CARD */
    .mrow{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-bottom:1px solid var(--divider);cursor:pointer;transition:background .12s}
    .mrow:hover{background:var(--bg-hovr)}
    .mrow.sel{background:var(--bg-sel);box-shadow:inset 3px 0 0 var(--accent)}

    .mrow-top{display:flex;align-items:center;gap:10px}

    /* THUMBNAIL CARD */
    .twrap{width:80px;height:54px;border-radius:6px;overflow:hidden;position:relative;flex-shrink:0;border:1px solid rgba(255,255,255,.1);background:#12141a}
    .tcanv{width:100%;height:100%;display:block}
    .tbadge{position:absolute;bottom:2px;right:2px;background:rgba(16,185,129,.95);color:#000;font-size:9px;font-weight:900;padding:1px 4px;border-radius:3px}

    /* MISSION META */
    .mmeta{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
    .msub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .guid-txt{font-size:10px;color:var(--dim);font-family:monospace}
    .mpills{display:flex;gap:4px;align-items:center}
    .pill{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap}
    .pp{background:var(--pp-bg);color:var(--pp-txt)}
    .tp{background:var(--tp-bg);color:var(--tp-txt)}

    /* ROW ACTIONS */
    .mact{display:flex;align-items:center;gap:4px;flex-shrink:0}
    .btn-del{width:36px;height:36px;border-radius:6px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.35);color:#f87171;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
    .btn-del:hover{background:rgba(239,68,68,0.35);color:#fff;border-color:#ef4444}
    .btn-del:active{transform:scale(.92)}

    /* FULL NAME AT BOTTOM OF CARD */
    .mrow-name{font-size:13px;font-weight:700;color:#ffffff;word-break:break-all;line-height:1.3;padding-top:4px;border-top:1px dashed rgba(255,255,255,0.08);margin-top:2px}

    .empty{padding:40px 16px;text-align:center;color:var(--dim);font-size:12px;line-height:1.7}

    /* BOTTOM BAR */
    .bbar{flex-shrink:0;background:#0d0e12;border-top:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
    .srow{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);gap:8px}
    .ssrc,.sdst{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sarr{color:var(--accent);font-size:14px;font-weight:900}
    .slbl{color:#fff;font-weight:700}
    
    .bbtns{display:flex;gap:8px}
    .bsync{flex:1;background:linear-gradient(135deg,#059669,#10b981);color:#000;border:none;padding:11px 8px;border-radius:7px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;letter-spacing:.01em;box-shadow:0 3px 10px rgba(16,185,129,.2);display:flex;align-items:center;justify-content:center;gap:5px}
    .bnew{flex:1;background:linear-gradient(135deg,#0284c7,#38bdf8);color:#000;border:none;padding:11px 8px;border-radius:7px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;letter-spacing:.01em;box-shadow:0 3px 10px rgba(56,189,248,.2);display:flex;align-items:center;justify-content:center;gap:5px}
    .bsync:active,.bnew:active{transform:scale(.98);opacity:.9}
    .bsync:disabled,.bnew:disabled{background:#22252e!important;color:#555a6a!important;box-shadow:none!important;cursor:not-allowed;border:1px solid var(--border)!important}

    .ltog{font-size:10px;color:var(--dim);background:transparent;border:none;cursor:pointer;text-align:left;font-family:inherit}
    .lbox{display:none;height:68px;background:#05070b;border-radius:4px;padding:6px 8px;font-family:monospace;font-size:10px;color:#34d399;overflow-y:auto;border:1px solid #1e2533}
    .lbox.open{display:block}

    @media(max-width:660px)and(orientation:portrait){.tbar{display:flex}.panel{display:none!important}.panel.vis{display:flex!important}}
    @media(min-width:661px),(orientation:landscape){.tbar{display:none!important}.panel{display:flex!important}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{display:inline-block;animation:spin 1s linear infinite}
  </style>
</head>
<body>

<div class="sbar">
  <div class="sleft">
    <div class="sdot" id="sdot"></div>
    <span class="slabel" id="stxt">Buscando DJI RC 2...</span>
  </div>
  <button class="btn-rc" onclick="refreshAll()">↻ Reconectar</button>
</div>

<div class="tbar">
  <button class="titem active" id="tab-dev" onclick="switchTab('dev')">🎮 RC 2 (DJI Fly)</button>
  <button class="titem" id="tab-local" onclick="switchTab('local')">📱 Misiones Locales</button>
</div>

<div class="split">
  <!-- PANEL DEVICE (RC 2) -->
  <div class="panel vis" id="panel-dev">
    <div class="phdr">
      <div class="ptitle">🎮 Misiones RC 2 (DJI Fly)</div>
      <div class="hacts">
        <button class="ibtn" title="Refrescar RC 2" onclick="refreshDeviceSlots()">↻</button>
        <button class="ibtn" title="Descargar al celular" onclick="downloadSelectedDeviceSlot()">⬇ Descargar</button>
      </div>
    </div>
    <div class="colhd">
      <span>MINIATURA Y DETALLES</span>
      <span>BORRAR</span>
    </div>
    <div class="rlist" id="list-dev">
      <div class="empty"><span class="spin">⏳</span><br>Escaneando ranuras en RC 2...</div>
    </div>
  </div>

  <!-- PANEL LOCAL -->
  <div class="panel vis" id="panel-local">
    <div class="phdr">
      <div class="ptitle">📱 Misiones Locales</div>
      <div class="hacts">
        <button class="ibtn" title="Refrescar locales" onclick="refreshLocalMissions()">↻</button>
        <button class="ibtn" title="Abrir archivo KMZ" onclick="pickLocalFile()">📂 Abrir</button>
      </div>
    </div>
    <div class="colhd">
      <span>MINIATURA Y DETALLES</span>
      <span>BORRAR</span>
    </div>
    <div class="rlist" id="list-local">
      <div class="empty"><span class="spin">⏳</span><br>Buscando archivos KMZ...</div>
    </div>
  </div>
</div>

<!-- BOTTOM BAR -->
<div class="bbar">
  <div class="srow">
    <div class="ssrc">Origen: <span class="slbl" id="src-name">Selecciona una misión local</span></div>
    <div class="sarr">⇒</div>
    <div class="sdst">RC 2: <span class="slbl" id="dst-slot">Selecciona ranura RC 2</span></div>
  </div>
  <div class="bbtns">
    <button class="bsync" id="btn-sync" disabled onclick="injectSelectedLocalToDevice()">
      ⚡ SOBREESCRIBIR EN RC 2
    </button>
    <button class="bnew" id="btn-new" disabled onclick="createSelectedLocalAsNewDeviceSlot()">
      ➕ CREAR NUEVA MISIÓN EN RC 2
    </button>
  </div>
  <button class="ltog" onclick="toggleLog()">[+] Consola MTP en tiempo real</button>
  <div class="lbox" id="log-box"></div>
</div>

<script>
let S = {
  deviceSlots: [],
  localMissions: [],
  selDeviceGuid: null,
  selLocalMission: null,
  connected: false
};

function esc(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function relTime(ts){
  if(!ts) return '--';
  const d = Math.round((Date.now()-ts)/1000);
  if(d < 60) return 'hace un momento';
  const m = Math.round(d/60);
  if(m < 60) return 'hace '+m+' min';
  const h = Math.round(m/60);
  if(h < 24) return 'hace '+h+' hr';
  const days = Math.round(h/24);
  return 'hace '+days+' días';
}
function shortGuid(g){ if(!g) return '--'; return g.length<=16 ? g : g.substring(0,16)+'...'; }

function appendLog(msg){
  const box = document.getElementById('log-box');
  const t = new Date().toTimeString().split(' ')[0];
  const div = document.createElement('div');
  div.textContent = '['+t+'] '+msg;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
function toggleLog(){ document.getElementById('log-box').classList.toggle('open'); }

function onDeviceStatusChanged(connected, description){
  S.connected = connected;
  const dot = document.getElementById('sdot'), txt = document.getElementById('stxt');
  dot.className = 'sdot ' + (connected ? 'ok' : 'err');
  txt.textContent = description || (connected ? 'DJI RC 2 Conectado y Listo' : 'Sin cable OTG conectado');
  updateSyncBtn();
  if(connected) {
    refreshDeviceSlots();
  } else {
    renderDeviceSlots();
  }
}
function onLogMessage(msg){ appendLog(msg); }

function updateSyncBtn(){
  const hasLocal = !!S.selLocalMission;
  const hasDevice = !!S.selDeviceGuid;
  document.getElementById('btn-sync').disabled = !(hasLocal && hasDevice);
  document.getElementById('btn-new').disabled = !hasLocal;
}

function switchTab(tab){
  ['dev','local'].forEach(function(id){
    document.getElementById('tab-'+id).classList.toggle('active', id===tab);
    document.getElementById('panel-'+id).classList.toggle('vis', id===tab);
  });
}

function renderDeviceSlots(){
  const c = document.getElementById('list-dev'), slots = S.deviceSlots;
  const td = document.getElementById('tab-dev');
  if(td) td.textContent = '🎮 RC 2 (DJI Fly) (' + (slots ? slots.length : 0) + ')';

  if(!slots || slots.length === 0){
    if(!S.connected) {
      c.innerHTML = '<div class="empty">🔌 Sin conexión USB-OTG.<br><small style="color:var(--muted)">Conecta el cable USB OTG al teléfono y desbloquea la pantalla del RC 2.</small></div>';
    } else {
      c.innerHTML = '<div class="empty">📂 No se encontraron ranuras de misión en RC 2.<br><small style="color:var(--muted)">Presiona el botón "➕ CREAR NUEVA MISIÓN EN RC 2" para transferir una.</small></div>';
    }
    document.getElementById('dst-slot').textContent = 'Sin ranura seleccionada';
    return;
  }

  if(!S.selDeviceGuid || !slots.some(s => s.guid === S.selDeviceGuid)){
    S.selDeviceGuid = slots[0].guid;
  }

  c.innerHTML = '';
  slots.forEach(function(slot, i){
    const isAct = slot.guid === S.selDeviceGuid;
    const isGuid = (!slot.displayName || slot.displayName === slot.guid);
    const nameStr = isGuid ? ('Misión RC 2 (#' + shortGuid(slot.guid) + ')') : slot.displayName;
    
    if (isAct) {
      document.getElementById('dst-slot').textContent = nameStr;
    }

    const row = document.createElement('div');
    row.className = 'mrow' + (isAct ? ' sel' : '');
    row.onclick = function(){ selectDeviceSlot(slot.guid); };

    const cid = 'cv-d-' + i;
    const wp = slot.wpCount ? (slot.wpCount + ' WP') : '-- WP';

    row.innerHTML = 
      '<div class="mrow-top">'
        +'<div class="twrap"><canvas id="'+cid+'" class="tcanv"></canvas><span class="tbadge">'+wp+'</span></div>'
        +'<div class="mmeta">'
          +'<div class="mpills"><span class="pill pp">DJI Fly RC 2</span></div>'
          +'<div class="msub">'+relTime(slot.dateModified)+' · '+wp+'</div>'
          +'<div class="msub guid-txt">GUID: '+esc(shortGuid(slot.guid))+'</div>'
        +'</div>'
        +'<div class="mact">'
          +'<button class="btn-del" title="Eliminar del RC 2" onclick="deleteDeviceSlotItem(\''+esc(slot.guid)+'\', \''+esc(nameStr)+'\', event)">🗑️</button>'
        +'</div>'
      +'</div>'
      +'<div class="mrow-name" title="'+esc(nameStr)+'">'+esc(nameStr)+'</div>';

    c.appendChild(row);
    drawThumb(cid, slot.coords || null, false);
  });

  updateSyncBtn();
}

function selectDeviceSlot(guid){
  S.selDeviceGuid = guid;
  const slot = S.deviceSlots.find(s => s.guid === guid);
  const isGuid = (!slot || !slot.displayName || slot.displayName === guid);
  const nameStr = slot ? (isGuid ? ('Misión RC 2 (#' + shortGuid(guid) + ')') : slot.displayName) : '--';
  document.getElementById('dst-slot').textContent = nameStr;
  renderDeviceSlots();
}

function renderLocalMissions(){
  const c = document.getElementById('list-local'), missions = S.localMissions;
  const tl = document.getElementById('tab-local');
  if(tl) tl.textContent = '📱 Misiones Locales (' + (missions ? missions.length : 0) + ')';

  if(!missions || missions.length === 0){
    c.innerHTML = '<div class="empty">📂 No se encontraron archivos .kmz<br><small style="color:var(--muted)">Guarda archivos .kmz en /sdcard/Download o usa "📂 Abrir".</small></div>';
    document.getElementById('src-name').textContent = 'Ninguna';
    return;
  }

  if(!S.selLocalMission || !missions.some(m => m.name === S.selLocalMission.name)){
    S.selLocalMission = missions[0];
  }
  document.getElementById('src-name').textContent = S.selLocalMission.name;

  c.innerHTML = '';
  missions.forEach(function(m, idx){
    const isSel = S.selLocalMission && S.selLocalMission.name === m.name;
    const row = document.createElement('div');
    row.className = 'mrow' + (isSel ? ' sel' : '');
    row.onclick = function(){ selectLocalMission(m); };

    const cid = 'cv-l-' + idx;
    const wp = m.wpCount ? (m.wpCount + ' WP') : '-- WP';
    const tag = m.tag || 'Descargas';

    row.innerHTML = 
      '<div class="mrow-top">'
        +'<div class="twrap"><canvas id="'+cid+'" class="tcanv"></canvas><span class="tbadge">'+wp+'</span></div>'
        +'<div class="mmeta">'
          +'<div class="mpills"><span class="pill tp">'+esc(tag)+'</span></div>'
          +'<div class="msub">'+esc(tag)+' · '+relTime(m.dateModified)+' · '+wp+'</div>'
        +'</div>'
        +'<div class="mact">'
          +'<button class="btn-del" title="Eliminar del celular" onclick="deleteLocalMissionItem(\''+esc(m.name)+'\', event)">🗑️</button>'
        +'</div>'
      +'</div>'
      +'<div class="mrow-name" title="'+esc(m.name)+'">'+esc(m.name)+'</div>';

    c.appendChild(row);
    drawThumb(cid, m.coords || null, true);
  });

  updateSyncBtn();
}

function selectLocalMission(m){
  S.selLocalMission = m;
  document.getElementById('src-name').textContent = m.name;
  renderLocalMissions();
}

function drawThumb(id, coords, isLocal){
  var canvas = document.getElementById(id);
  if(!canvas) return;
  var ctx = canvas.getContext('2d'), W = canvas.width = 160, H = canvas.height = 108;

  // Background fallback
  if(isLocal){
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#381010');
    g.addColorStop(1, '#1a0606');
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = '#0f1520';
  }
  ctx.fillRect(0, 0, W, H);

  if(!coords || coords.length === 0){
    ctx.strokeStyle = isLocal ? 'rgba(120,30,30,0.4)' : 'rgba(30,60,100,0.3)';
    ctx.lineWidth = 0.5;
    for(var x=0; x<=W; x+=18){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(var y=0; y<=H; y+=18){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    var lc = isLocal ? '#22c55e' : '#38bdf8';
    ctx.strokeStyle = lc; ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.beginPath();
    var cols = 5, rows = 4;
    var xs = [], ys = [];
    for(var i=0; i<cols; i++) xs.push(18 + i*((W-36)/(cols-1)));
    for(var i=0; i<rows; i++) ys.push(16 + i*((H-32)/(rows-1)));
    var fp = true;
    for(var r=0; r<rows; r++){
      var rXs = (r%2 === 0) ? xs.slice().reverse() : xs;
      rXs.forEach(function(xv){ if(fp){ ctx.moveTo(xv, ys[r]); fp = false; } else ctx.lineTo(xv, ys[r]); });
      if(r < rows-1) ctx.lineTo((r%2 === 0) ? xs[0] : xs[xs.length-1], ys[r+1]);
    }
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    for(var r=0; r<rows; r++){
      var rXs = (r%2 === 0) ? xs.slice().reverse() : xs;
      rXs.forEach(function(xv){ ctx.beginPath(); ctx.arc(xv, ys[r], 2.5, 0, Math.PI*2); ctx.fill(); });
    }
    return;
  }

  var minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  coords.forEach(function(pt){
    if(pt[0]<minX) minX=pt[0]; if(pt[0]>maxX) maxX=pt[0];
    if(pt[1]<minY) minY=pt[1]; if(pt[1]>maxY) maxY=pt[1];
  });
  var pad = 10, sx = (maxX-minX)||0.0001, sy = (maxY-minY)||0.0001;
  function toXY(pt){ return [pad+((pt[0]-minX)/sx)*(W-pad*2), H-(pad+((pt[1]-minY)/sy)*(H-pad*2))]; }

  function drawWaypointsOverlay() {
    ctx.shadowColor = isLocal ? 'rgba(34, 197, 94, 0.9)' : 'rgba(56, 189, 248, 0.9)';
    ctx.shadowBlur = 4;
    ctx.strokeStyle = isLocal ? '#22c55e' : '#38bdf8';
    ctx.lineWidth = 2.0; ctx.lineJoin = 'round'; ctx.beginPath();
    coords.forEach(function(pt, i){ var p = toXY(pt); if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); });
    ctx.stroke();

    ctx.shadowBlur = 0;
    var rad = coords.length > 50 ? 1.2 : (coords.length > 20 ? 1.8 : 3.0);
    ctx.fillStyle = '#ffffff';
    coords.forEach(function(pt){ var p = toXY(pt); ctx.beginPath(); ctx.arc(p[0], p[1], rad, 0, Math.PI*2); ctx.fill(); });
  }

  // ESRI ArcGIS Satellite World Imagery Map Export
  try {
    var r = 6378137.0;
    var xmin = minX * Math.PI / 180 * r;
    var xmax = maxX * Math.PI / 180 * r;
    var ymin = Math.log(Math.tan((90 + minY) * Math.PI / 360)) * r;
    var ymax = Math.log(Math.tan((90 + maxY) * Math.PI / 360)) * r;

    var dx = (xmax - xmin) || 500, dy = (ymax - ymin) || 500;
    xmin -= dx * 0.25; xmax += dx * 0.25;
    ymin -= dy * 0.25; ymax += dy * 0.25;

    var esriUrl = 'https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/export?bbox='
        + Math.round(xmin) + ',' + Math.round(ymin) + ',' + Math.round(xmax) + ',' + Math.round(ymax)
        + '&bboxSR=102100&size=160,108&imageSR=102100&format=jpg&f=image';

    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      ctx.drawImage(img, 0, 0, W, H);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.fillRect(0, 0, W, H);
      drawWaypointsOverlay();
    };
    img.onerror = function() {
      drawWaypointsOverlay();
    };
    img.src = esriUrl;
  } catch(e) {
    drawWaypointsOverlay();
  }
}

async function parseKmzWaypoints(b64){
  try {
    var zip = await JSZip.loadAsync(b64, {base64: true});
    var kml = '';
    var wf = zip.file('wpmz/waylines.wpml') || zip.file('waylines.wpml');
    var tf = zip.file('wpmz/template.kml') || zip.file('template.kml');
    if(wf) kml = await wf.async('text');
    else if(tf) kml = await tf.async('text');
    else {
      for(var n of Object.keys(zip.files)){
        if(n.endsWith('.kml') || n.endsWith('.wpml')){
          kml = await zip.file(n).async('text'); break;
        }
      }
    }
    if(!kml) return {wpCount:0, coords:[]};

    var coords = [], re = /<coordinates>([\s\S]*?)<\/coordinates>/gi, m;
    while((m = re.exec(kml)) !== null){
      m[1].trim().split(/\s+/).forEach(function(p){
        var xyz = p.split(',');
        if(xyz.length >= 2){
          var lo = parseFloat(xyz[0]), la = parseFloat(xyz[1]);
          if(!isNaN(lo) && !isNaN(la)) coords.push([lo, la]);
        }
      });
    }
    var placemarks = (kml.match(/<Placemark/gi)||[]).length;
    return {wpCount: placemarks || coords.length, coords: coords};
  } catch(e) {
    return {wpCount: 0, coords: []};
  }
}

function refreshAll(){
  if(window.AndroidBridge && window.AndroidBridge.refreshUsb) window.AndroidBridge.refreshUsb();
  refreshDeviceSlots();
  refreshLocalMissions();
}

function refreshDeviceSlots(){
  document.getElementById('list-dev').innerHTML = '<div class="empty"><span class="spin">⏳</span> Escaneando RC 2...</div>';
  if(window.AndroidBridge){
    if(window.AndroidBridge.fetchDeviceSlotsAsync){
      window.AndroidBridge.fetchDeviceSlotsAsync();
    } else if(window.AndroidBridge.getDeviceSlotsJson){
      try {
        S.deviceSlots = JSON.parse(window.AndroidBridge.getDeviceSlotsJson());
      } catch(e) { S.deviceSlots = []; }
      renderDeviceSlots();
    }
  }
}

function onDeviceSlotsLoaded(rawJson){
  try {
    S.deviceSlots = typeof rawJson === 'string' ? JSON.parse(rawJson) : rawJson;
  } catch(e) {
    S.deviceSlots = [];
  }
  renderDeviceSlots();
}

function refreshLocalMissions(){
  document.getElementById('list-local').innerHTML = '<div class="empty"><span class="spin">⏳</span> Escaneando descargas...</div>';
  if(window.AndroidBridge){
    if(window.AndroidBridge.fetchLocalMissionsAsync){
      window.AndroidBridge.fetchLocalMissionsAsync();
    } else if(window.AndroidBridge.getLocalMissionsJson){
      try {
        onLocalMissionsLoaded(window.AndroidBridge.getLocalMissionsJson());
      } catch(e) {}
    }
  }
}

async function onLocalMissionsLoaded(rawJson){
  try {
    var list = typeof rawJson === 'string' ? JSON.parse(rawJson) : rawJson;
    S.localMissions = list || [];
    for(var m of S.localMissions){
      if(m.base64 && (!m.coords || m.coords.length === 0)){
        var p = await parseKmzWaypoints(m.base64);
        m.wpCount = p.wpCount;
        m.coords = p.coords;
      }
    }
    renderLocalMissions();
  } catch(e) {
    appendLog('Error leyendo locales: ' + e.message);
    renderLocalMissions();
  }
}

function pickLocalFile(){
  if(window.AndroidBridge && window.AndroidBridge.pickFile) window.AndroidBridge.pickFile();
}

function injectSelectedLocalToDevice(){
  if(!S.selLocalMission){ alert('Selecciona una misión local primero.'); return; }
  var guid = S.selDeviceGuid || (S.deviceSlots.length > 0 ? S.deviceSlots[0].guid : null);
  if(!guid){ alert('No hay ranura en RC 2 seleccionada.'); return; }

  var slotObj = S.deviceSlots.find(s => s.guid === guid);
  var targetName = slotObj ? ((slotObj.displayName && slotObj.displayName !== slotObj.guid) ? slotObj.displayName : shortGuid(guid)) : shortGuid(guid);

  if(!confirm('¿Sobreescribir la misión "' + targetName + '" en RC 2 con "' + S.selLocalMission.name + '"?')) return;

  appendLog('[MTP] Sobreescribiendo ' + S.selLocalMission.name + ' hacia ' + targetName + '...');
  if(window.AndroidBridge && window.AndroidBridge.overwriteSlotFromLocal){
    var ok = window.AndroidBridge.overwriteSlotFromLocal(guid, S.selLocalMission.name);
    if(ok) setTimeout(refreshDeviceSlots, 1200);
  }
}

function createSelectedLocalAsNewDeviceSlot(){
  if(!S.selLocalMission){ alert('Selecciona una misión local primero.'); return; }

  if(!confirm('¿Crear una NUEVA misión en DJI Fly (RC 2) basada en "' + S.selLocalMission.name + '"?')) return;

  appendLog('[MTP] Creando nueva misión en RC 2 desde ' + S.selLocalMission.name + '...');
  if(window.AndroidBridge && window.AndroidBridge.createNewSlotFromLocal){
    var ok = window.AndroidBridge.createNewSlotFromLocal(S.selLocalMission.name);
    if(ok) setTimeout(refreshDeviceSlots, 1200);
  }
}

function downloadSelectedDeviceSlot(){
  if(!S.selDeviceGuid){ alert('Selecciona una ranura del control remoto.'); return; }
  if(window.AndroidBridge && window.AndroidBridge.downloadDeviceSlot) window.AndroidBridge.downloadDeviceSlot(S.selDeviceGuid);
}

function deleteLocalMissionItem(fileName, e){
  if(e) e.stopPropagation();
  if(!confirm('¿Eliminar la misión local "' + fileName + '" del teléfono?')) return;
  if(window.AndroidBridge && window.AndroidBridge.deleteLocalMission){
    window.AndroidBridge.deleteLocalMission(fileName);
  }
}

function deleteDeviceSlotItem(guid, displayName, e){
  if(e) e.stopPropagation();
  var nameStr = displayName || shortGuid(guid);
  if(!confirm('¿Eliminar la misión "' + nameStr + '" del control RC 2?')) return;
  if(window.AndroidBridge && window.AndroidBridge.deleteDeviceSlot){
    window.AndroidBridge.deleteDeviceSlot(guid);
  }
}

window.onload = function(){
  switchTab('dev');
  refreshAll();
};
</script>
